      return count(o, FFFD) > budget ? null : [o, g];
    } else {
      try { out = decode(raw, original, false); } catch (e) { out = decode(raw, original, true); }
      out = out.split("\x1a").join(FFFD);
    }
    if (count(out, FFFD) > budget) return null;
    return [out, 0];
  }

  function search(text) {
    const base = score(text);
    let beam = [[base, text, [], 0]], bestE = beam[0];
    for (let depth = 0; depth < MAX_DEPTH; depth++) {
      const nxt = [];
      for (const [, t, steps, g] of beam) {
        for (const shown of ENCODINGS) {
          if (shown === "utf-8") continue;   // legacy bytes read as UTF-8 become U+FFFD: nothing to undo
          for (const orig of ENCODINGS) {
            const last = steps[steps.length - 1];
            if (orig === shown || (last && last.original === shown && last.shownAs === orig)) continue;
            const r = undo(t, orig, shown, false);
            if (!r || r[0] === t) continue;
            nxt.push([score(r[0]), r[0], steps.concat([{ original: orig, shownAs: shown }]), g + r[1]]);
          }
        }
      }
      if (!nxt.length) break;
      nxt.sort((a, b) => b[0] - a[0]);
      const top = nxt.slice(0, BEAM);
      const short = nxt.filter((c) => c[3] === 0 && !c[1].includes(FFFD))
        .sort((a, b) => Array.from(a[1]).length - Array.from(b[1]).length).slice(0, 4);
      beam = top.concat(short.filter((c) => !top.includes(c)));
      if (beam[0][0] > bestE[0] + (bestE[2].length ? 0.3 : 0.05)) bestE = beam[0];
      if (bestE[2].length && bestE[0] >= 2.5 && !suspicious(bestE[1])) break;
    }
    if (bestE[2].length) bestE = replay(text, bestE);
    return [base, bestE];
  }
  function replay(text, cand) {   // redo the winning chain with lost-byte repair switched on
    let t = text, g = 0;
    for (const st of cand[2]) {
      const r = undo(t, st.original, st.shownAs, true);
      if (!r) return cand;
      t = r[0]; g += r[1];
    }
    const s = score(t);
    return s >= cand[0] ? [s, t, cand[2], g] : cand;
  }

  function result(text, fixed, extra) {
    return Object.assign({ text, fixed, steps: [], guessed: 0, lost: 0, before: 0, after: 0, note: "",
      changed: fixed !== text }, extra || {});
  }

  function fixUnit(text, minGain, minPairs = 3) {
    if (text.includes("锟斤拷") || count(text, "锟") >= 2) {
      const r = undo(text, "utf-8", "gbk", true);
      if (r) return result(text, r[0], { steps: [{ original: "utf-8", shownAs: "gbk" }], lost: count(r[0], FFFD),
        before: score(text), after: score(r[0]), note: "kunjinkao" });
    }

      return result(text, out, { steps, guessed: g, lost: count(out, FFFD), before: base, after: s });

  }

  const TOKEN = /([\s,，。:：;；/\\|()（）\[\]【】"'<>《》=]+)/u;
  const TOKEN_FULL = /^[\s,，。:：;；/\\|()（）\[\]【】"'<>《》=]+$/u;

  function fix(text) {
    const whole = fixUnit(text, MIN_GAIN);
    if (whole.changed || !text.trim()) return whole;
    const results = text.split(TOKEN).map((p) =>
      p && !TOKEN_FULL.test(p) && /[^\x00-\x7f]/.test(p) ? fixUnit(p, MIN_GAIN * 1.5, 6) : result(p, p));
    const changed = results.filter((r) => r.changed);
    if (!changed.length) return whole;
    const fixed = results.map((r) => r.fixed).join("");
    return result(text, fixed, { steps: changed[0].steps, guessed: changed.reduce((a, r) => a + r.guessed, 0),
      lost: changed.reduce((a, r) => a + r.lost, 0), before: score(text), after: score(fixed),
      note: "pieces", pieces: changed.length });
  }

  const api = { fix, fixText: (t) => fix(t).fixed, score, suspicious, encode, decode, ENCODINGS, LABEL };
  root.luanma = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>
(function () {
  const T = {
    zh: { tagline: "乱码克星 · 把乱码变回人话", sub: "把「鏂囦欢」「æ–‡ä»¶」「╬─╝■」这类中日韩乱码还原成原文。自动识别出错的编码路径，支持多层乱码，并能推测部分已丢失的字节。",

      tangtang: "「烫烫烫/屯屯屯」不是乱码：这是 VC++ 调试模式下未初始化的内存（0xCC / 0xCD）。" },
    en: { tagline: "turn mojibake back into text", sub: "Turns garbled Chinese / Japanese / Korean text (“æ–‡ä»¶”, “鏂囦欢”, “╬─╝■”) back into the original. Finds the chain of wrong decodings automatically, including multi-layer mojibake and lost bytes.",
      input: "Paste garbled text", output: "Fixed text", clear: "Clear", copy: "Copy", copied: "Copied", download: "Download as UTF-8", examples: "Try:",
      drop: "Or drop a garbled file here (.txt / .csv / .srt …) — encoding is detected and fixed", privacy: "Runs entirely in your browser. Nothing is uploaded",
      step: (a, b) => `${a} bytes were decoded as ${b}`, nth: (i) => `Error ${i}: `, guessed: (n) => `${n} lost byte(s) were guessed from character frequency (please double-check)`,
      lost: (n) => `${n} character(s) are permanently lost (shown as �)`, conf: (c, a, b) => `Confidence ≈ ${c}% (score ${a} → ${b})`, clean: "Text looks fine — nothing changed.",
      none: "No reliable fix found; text left unchanged.", pieces: (n) => `Fixed ${n} garbled fragment(s)`, file: (n, e) => `File "${n}" read as ${e}`,
      kunjinkao: "\"锟斤拷\": GBK text was once read as UTF-8 and saved; the original bytes were replaced and cannot be recovered.",
      tangtang: "\"烫烫烫 / 屯屯屯\" is not mojibake: it is uninitialised memory (0xCC / 0xCD) in MSVC debug builds." },
    ja: { tagline: "文字化けを元の文字に", sub: "「縺薙ｓ縺ｫ縺｡縺ｯ」「ã“ã‚“」のような日中韓の文字化けを元の文字に戻します。誤変換の経路を自動で特定し、多重の文字化けや欠落バイトの推測にも対応。",
      input: "文字化けしたテキストを貼り付け", output: "修復結果", clear: "クリア", copy: "コピー", copied: "コピーしました", download: "UTF-8 で保存", examples: "例：",
      drop: "または文字化けしたファイルをここにドロップ（.txt / .csv / .srt …）", privacy: "すべてブラウザ内で処理され、何も送信されません",
      step: (a, b) => `${a} のデータが ${b} として読み込まれた`, nth: (i) => `誤り${i}：`, guessed: (n) => `失われた ${n} バイトを文字頻度から推測して補完（要確認）`,
      lost: (n) => `${n} 文字は完全に失われています（� で表示）`, conf: (c, a, b) => `信頼度 約${c}%（スコア ${a} → ${b}）`, clean: "正常なテキストのようです。変更なし。",
      none: "確実な修復方法が見つからないため、そのままにしました。", pieces: (n) => `${n} か所の文字化けを部分的に修復`, file: (n, e) => `ファイル「${n}」を ${e} として読み込み`,
      kunjinkao: "「锟斤拷」：GBK のデータが UTF-8 として読まれて保存されたもので、失われた部分は復元できません。",

  };
  const EXAMPLES = ["鎴戞槸涓€鍙尗", "╬─╝■├√.txt", "ä¸­æ–‡ä¹±ç ", "縺薙ｓ縺ｫ縺｡縺ｯ", "ÄãºÃ£¬ÊÀ½ç", "屷攜偼擫偱偁傞", "ì•ˆë…•í•˜ì„¸ìš”", "羉砰いゅ", "锟斤拷锟斤拷"];
  const $ = (id) => document.getElementById(id);
  let lang = localStorage.getItem("luanma-lang") || (navigator.language || "zh").slice(0, 2);
  if (!T[lang]) lang = "en";
  let fileName = null;

  function setLang(l) {
    lang = l; localStorage.setItem("luanma-lang", l);
    document.documentElement.lang = { zh: "zh-CN", en: "en", ja: "ja" }[l];
    document.querySelectorAll("[data-i18n]").forEach((e) => { e.textContent = T[l][e.dataset.i18n]; });
    document.querySelectorAll(".langs button").forEach((b) => b.classList.toggle("on", b.dataset.l === l));
    run();
  }
  function explain(r, extra) {
    const t = T[lang], lines = extra ? [extra] : [];
    if (!r.changed) {
      lines.push(r.note && t[r.note] ? t[r.note] : r.before < 1 && luanma.suspicious(r.text) ? t.none : t.clean);
      return [lines.join("\n"), r.note ? "warn" : ""];
    }
    r.steps.slice().reverse().forEach((s, i) => lines.push(t.nth(i + 1) + t.step(luanma.LABEL[s.original], luanma.LABEL[s.shownAs])));
    if (r.note === "pieces") lines.push(t.pieces(r.pieces));
    if (r.guessed) lines.push(t.guessed(r.guessed));
    if (r.lost) lines.push(t.lost(r.lost));
    if (r.note && t[r.note] && r.note !== "pieces") lines.push(t[r.note]);
    if (r.note !== "kunjinkao") {
      const conf = Math.max(0, Math.min(99, Math.round(50 + (r.after - r.before) * 15)));
      lines.push(t.conf(conf, r.before.toFixed(2), r.after.toFixed(2)));
    }
    return [lines.join("\n"), r.guessed || r.lost ? "warn" : "ok"];
  }
  let fileInfo = "";
  function run() {
    const text = $("in").value;
    if (!text.trim()) { $("out").value = ""; $("explain").textContent = ""; $("explain").className = ""; return; }
    const r = luanma.fix(text);
    $("out").value = r.fixed;
    const [msg, cls] = explain(r, fileInfo);
    $("explain").textContent = msg; $("explain").className = cls;
  }
  let timer;
  $("in").addEventListener("input", () => { fileInfo = ""; $("download").classList.add("hidden"); clearTimeout(timer); timer = setTimeout(run, 150); });
  $("clear").onclick = () => { $("in").value = ""; fileInfo = ""; run(); $("in").focus(); };
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("out").value); } catch (e) { $("out").select(); document.execCommand("copy"); }
    const b = $("copy"); b.textContent = T[lang].copied; setTimeout(() => (b.textContent = T[lang].copy), 1200);
  };
  $("download").onclick = () => {
    const blob = new Blob(["\ufeff" + $("out").value], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = (fileName || "fixed.txt").replace(/(\.[^.]+)?$/, ".fixed$1"); a.click();
  };
  document.querySelectorAll(".langs button").forEach((b) => (b.onclick = () => setLang(b.dataset.l)));
  EXAMPLES.forEach((ex) => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = ex.length > 14 ? ex.slice(0, 13) + "…" : ex;
    b.onclick = () => { $("in").value = ex; fileInfo = ""; run(); }; $("examples").appendChild(b);
  });

  // files: pick the decoding that looks most like real text, then fix
  async function openFile(f) {
    const bytes = new Uint8Array(await f.arrayBuffer());
    let bestT = null, bestS = -1e9, bestE = "";
    for (const enc of ["utf-8", "gbk", "big5", "shift_jis", "euc_kr"]) {
      let t;
      try { t = luanma.decode(bytes, enc, false); } catch (e) { continue; }
      const s = luanma.score(t.slice(0, 20000));
      if (s > bestS + (enc === "utf-8" ? 0 : 0.3)) { bestT = t; bestS = s; bestE = luanma.LABEL[enc]; }
    }
    if (bestT === null) { bestT = luanma.decode(bytes, "utf-8", true); bestE = "UTF-8"; }
    fileName = f.name; fileInfo = T[lang].file(f.name, bestE);
    $("in").value = bestT.replace(/^\ufeff/, ""); run(); $("download").classList.remove("hidden");
  }
  const drop = $("drop");
  drop.onclick = () => $("file").click();
  $("file").onchange = (e) => e.target.files[0] && openFile(e.target.files[0]);
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => e.dataTransfer.files[0] && openFile(e.dataTransfer.files[0]));

  if (q) $("in").value = q;
  setLang(lang);
})();
